name: Free Tier Keepalive

on:
  schedule:
    # Twice daily — Free Supabase wants regular DB activity; Upstash archives ~30d idle.
    - cron: "0 6 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: free-tier-keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase REST (profiles)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "Missing SUPABASE_URL or SUPABASE_ANON_KEY secret."
            exit 1
          fi

          BASE_URL="${SUPABASE_URL%/}"
          URL="${BASE_URL}/rest/v1/profiles?select=id&limit=1"

          # A few real DB reads per run — closer to Supabase's "activity this week" bar.
          for i in 1 2 3; do
            HTTP_CODE="$(curl -sS -o /tmp/supabase-keepalive-body -w "%{http_code}" \
              -H "apikey: ${SUPABASE_ANON_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
              -H "Accept: application/json" \
              "$URL")"

            echo "Supabase ping ${i}/3 HTTP status: ${HTTP_CODE}"

            case "${HTTP_CODE}" in
              2??) ;;
              *)
                echo "Supabase keepalive request failed (non-2xx)."
                exit 1
                ;;
            esac

            sleep 2
          done

      - name: Ping Upstash Redis (SET + GET)
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${UPSTASH_REDIS_REST_URL:-}" ] || [ -z "${UPSTASH_REDIS_REST_TOKEN:-}" ]; then
            echo "Missing UPSTASH_REDIS_REST_URL or UPSTASH_REDIS_REST_TOKEN secret."
            exit 1
          fi

          BASE_URL="${UPSTASH_REDIS_REST_URL%/}"
          # Real data commands count as activity; PING alone does not.
          SET_URL="${BASE_URL}/set/dandi:keepalive/1/ex/604800"
          GET_URL="${BASE_URL}/get/dandi:keepalive"

          SET_CODE="$(curl -sS -o /tmp/upstash-keepalive-set -w "%{http_code}" \
            -H "Authorization: Bearer ${UPSTASH_REDIS_REST_TOKEN}" \
            "$SET_URL")"
          echo "Upstash SET HTTP status: ${SET_CODE}"
          case "${SET_CODE}" in
            2??) ;;
            *)
              echo "Upstash SET keepalive failed (non-2xx)."
              exit 1
              ;;
          esac

          GET_CODE="$(curl -sS -o /tmp/upstash-keepalive-get -w "%{http_code}" \
            -H "Authorization: Bearer ${UPSTASH_REDIS_REST_TOKEN}" \
            "$GET_URL")"
          echo "Upstash GET HTTP status: ${GET_CODE}"
          case "${GET_CODE}" in
            2??) ;;
            *)
              echo "Upstash GET keepalive failed (non-2xx)."
              exit 1
              ;;
          esac
