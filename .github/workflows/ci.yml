name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ improvements, main ]
  pull_request:
    branches: [ improvements, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Use Node.js 20
      uses: actions/setup-node@v6
      with:
        node-version: 20
        cache: 'yarn'

    - name: Install dependencies
      run: yarn install --frozen-lockfile

    - name: Cache Next.js build
      uses: actions/cache@v4
      with:
        path: |
          ${{ github.workspace }}/.next/cache
        key: ${{ runner.os }}-nextjs-${{ hashFiles('**/yarn.lock') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
        restore-keys: |
          ${{ runner.os }}-nextjs-${{ hashFiles('**/yarn.lock') }}-

    - name: Run lint
      run: yarn lint

    - name: Run typecheck
      run: yarn typecheck

    - name: Run tests
      run: yarn test

    - name: Build project
      run: yarn build
      env:
        NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
        NEXT_PUBLIC_SUPABASE_ANON_KEY: "mock-anon-key"
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: "pk_test_mock"
        NEXT_PUBLIC_APP_URL: "http://localhost:3000"
        NEXT_PUBLIC_STRIPE_PREMIUM_MONTHLY_PRICE_ID: "price_mock"
        NEXT_PUBLIC_STRIPE_PREMIUM_YEARLY_PRICE_ID: "price_mock"
        NEXT_PUBLIC_STRIPE_RESEARCHER_MONTHLY_PRICE_ID: "price_mock"
        NEXT_PUBLIC_STRIPE_RESEARCHER_YEARLY_PRICE_ID: "price_mock"
        SUPABASE_SERVICE_ROLE_KEY: "mock-service-role"
        STRIPE_SECRET_KEY: "sk_test_mock"
        STRIPE_WEBHOOK_SECRET: "whsec_mock"
        UPSTASH_REDIS_REST_URL: "https://mock.upstash.io"
        UPSTASH_REDIS_REST_TOKEN: "mock-token"
        GOOGLE_API_KEY: "mock-google-key"
        DEMO_API_KEY: "sk_live_demo_key_dandi_2026"
        NEXT_PUBLIC_DEMO_API_KEY: "sk_live_demo_key_dandi_2026"
        API_KEY_HMAC_SECRET: "mock-hmac-secret-key-32-chars-for-ci-pipeline-pass"

