name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "mock-anon-key"
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: "pk_test_mock"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      NEXT_PUBLIC_STRIPE_PREMIUM_MONTHLY_PRICE_ID: "price_mock"
      NEXT_PUBLIC_STRIPE_PREMIUM_YEARLY_PRICE_ID: "price_mock"
      NEXT_PUBLIC_STRIPE_RESEARCHER_MONTHLY_PRICE_ID: "price_mock"
      NEXT_PUBLIC_STRIPE_RESEARCHER_YEARLY_PRICE_ID: "price_mock"
      SUPABASE_SERVICE_ROLE_KEY: "mock-service-role"
      STRIPE_SECRET_KEY: "sk_test_mock"
      STRIPE_WEBHOOK_SECRET: "whsec_mock"
      UPSTASH_REDIS_REST_URL: "https://mock.upstash.io"
      UPSTASH_REDIS_REST_TOKEN: "mock-token"
      GOOGLE_API_KEY: "mock-google-key"
      API_KEY_HMAC_SECRET: "mock-hmac-secret-key-32-chars-for-ci-pipeline-pass"

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Use Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies from lockfile
        run: yarn install --frozen-lockfile

      - name: Audit production dependencies
        run: yarn audit --groups dependencies --level high

      - name: Cache Next.js build
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/yarn.lock') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: ${{ runner.os }}-nextjs-${{ hashFiles('**/yarn.lock') }}-

      - name: Run migration, lint, type, test, and build gate
        run: yarn ci:check
